apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-metering
  namespace: maas-metering
  labels:
    app: maas-metering
    app.kubernetes.io/name: maas-metering
    app.kubernetes.io/component: metering
    app.kubernetes.io/part-of: models-as-a-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-metering
  template:
    metadata:
      labels:
        app: maas-metering
    spec:
      serviceAccountName: maas-metering-sa
      containers:
      - name: maas-metering
        image: quay.io/bryonbaker/maas-metering:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ALLOW_VALUE
          value: "true"  # Phase 1: Hardcoded to allow. Change to "false" to test deny.
        - name: PORT
          value: "8080"
        args:
        - "--port=8080"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

